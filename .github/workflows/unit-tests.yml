name: Unit Tests

on:
    workflow_call:
        inputs:
            PYTHON_VERSION:
                description: Python version used to run backend tests
                required: false
                type: string
                default: "3.12"
    workflow_dispatch:
        inputs:
            PYTHON_VERSION:
                description: Python version used to run backend tests
                required: false
                type: string
                default: "3.12"

jobs:
    unit-tests-backend:
        name: Backend
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

            - name: Set up uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  python-version: ${{ inputs.PYTHON_VERSION }}
                  enable-cache: true
                  cache-dependency-glob: backend/uv.lock

            - name: Install backend dependencies
              working-directory: backend
              run: uv sync --group dev

            - name: Run tests
              working-directory: backend
              run: uv run pytest --cov=app --cov-report=term-missing

    unit-tests-mcp-datetime:
        name: mcp-datetime
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

            - name: Set up uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  python-version: ${{ inputs.PYTHON_VERSION }}
                  enable-cache: true
                  cache-dependency-glob: mcp-datetime/uv.lock

            - name: Install mcp-datetime dependencies
              working-directory: mcp-datetime
              run: uv sync --group dev

            - name: Run tests
              working-directory: mcp-datetime
              run: uv run pytest

    unit-tests-mcp-search:
        name: mcp-search
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

            - name: Set up uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  python-version: ${{ inputs.PYTHON_VERSION }}
                  enable-cache: true
                  cache-dependency-glob: mcp-search/uv.lock

            - name: Install mcp-search dependencies
              working-directory: mcp-search
              run: uv sync --group dev

            - name: Run tests
              working-directory: mcp-search
              run: uv run pytest
