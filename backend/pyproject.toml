[project]
name = "toolmesh-backend"
version = "0.12.0"
description = "toolmesh backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.1",
    "pyjwt[crypto]>=2.15.1",
    "pydantic-settings>=2.16.1",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "redis>=8.1.0",
    "python-keycloak>=7.1.1",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pyyaml>=6",
    "qdrant-client>=1.14",
]

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "ruff>=0.15.0",
    "fakeredis>=2.40.0",
    "aiosqlite>=0.20",
]
dev = [{ include-group = "test" }]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
