{{- if .Values.enabled }}
{{- if eq .Values.mcp_search.deploymentType "DaemonSet" }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "mcp_search") }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "mcp_search")) | nindent 4 }}
spec:
  revisionHistoryLimit: {{ .Values.mcp_search.revisionHistoryLimit | default 10 }}
  selector:
    matchLabels: {{- include "helper.selectorLabels" (dict "root" . "componentName" "mcp_search") | nindent 6 }}
  {{- with .Values.mcp_search.updateStrategy }}
  updateStrategy: {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    {{- include "helper.component.podTemplate" (dict "root" . "name" "mcp_search" "component" .Values.mcp_search) | nindent 4 }}
{{- end }}
{{- end }}
