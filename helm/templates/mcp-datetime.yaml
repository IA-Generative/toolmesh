{{- if and .Values.enabled .Values.mcpDatetime.enabled }}
{{- $m := .Values.mcpDatetime }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helm.mcpDatetime.fullname" . }}
  labels:
    {{- include "helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-datetime
spec:
  replicas: {{ $m.replicaCount }}
  selector:
    matchLabels:
      {{- include "helm.mcpDatetime.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "helm.mcpDatetime.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mcp-datetime
          image: "{{ $m.image.repository }}:{{ default .Values.image.tag $m.image.tag }}"
          imagePullPolicy: {{ $m.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          {{- with $m.env }}
          env:
            {{- range $key, $value := . }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          # Any HTTP answer (401 without a token) proves the server is up.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml $m.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "helm.mcpDatetime.fullname" . }}
  labels:
    {{- include "helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-datetime
spec:
  type: {{ $m.service.type }}
  ports:
    - port: {{ $m.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "helm.mcpDatetime.selectorLabels" . | nindent 4 }}
{{- if $m.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "helm.mcpDatetime.fullname" . }}
  labels:
    {{- include "helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-datetime
  {{- with $m.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $m.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $m.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ $m.ingress.host | quote }}
      http:
        paths:
          - path: {{ $m.ingress.path }}
            pathType: {{ $m.ingress.pathType }}
            backend:
              service:
                name: {{ include "helm.mcpDatetime.fullname" . }}
                port:
                  name: http
{{- end }}
{{- end }}
