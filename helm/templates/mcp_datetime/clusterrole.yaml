{{- if .Values.enabled }}
{{- if and .Values.mcp_datetime.serviceAccount.enabled .Values.mcp_datetime.serviceAccount.clusterRole.create .Values.mcp_datetime.serviceAccount.clusterRole.rules }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "mcp_datetime") }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "mcp_datetime")) | nindent 4 }}
rules: {{- toYaml .Values.mcp_datetime.serviceAccount.clusterRole.rules | nindent 0 }}
{{- end }}
{{- end }}
