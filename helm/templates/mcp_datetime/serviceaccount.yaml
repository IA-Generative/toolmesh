{{- if .Values.enabled }}
{{- if and .Values.mcp_datetime.serviceAccount.enabled .Values.mcp_datetime.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.mcp_datetime.serviceAccount.name | default (include "helper.componentFullname" (dict "root" . "componentName" "mcp_datetime")) }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "mcp_datetime")) | nindent 4 }}
  {{- if .Values.mcp_datetime.serviceAccount.annotations }}
  annotations:
    {{- tpl (toYaml .Values.mcp_datetime.serviceAccount.annotations) . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.mcp_datetime.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- end }}
