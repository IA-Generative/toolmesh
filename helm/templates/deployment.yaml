{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helm.fullname" . }}
  labels:
    {{- include "helm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "helm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "helm.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: TOOLMESH_OIDC_ISSUER
              value: {{ .Values.oidc.issuer | quote }}
            - name: TOOLMESH_OIDC_AUDIENCE
              value: {{ .Values.oidc.audience | quote }}
            {{- with .Values.oidc.jwksUrl }}
            - name: TOOLMESH_OIDC_JWKS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oidc.tokenUrl }}
            - name: TOOLMESH_OIDC_TOKEN_URL
              value: {{ . | quote }}
            {{- end }}
            - name: TOOLMESH_OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            - name: TOOLMESH_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "helm.oidcSecretName" . }}
                  key: {{ .Values.oidc.clientSecret.key }}
            {{- if and .Values.mcpDatetime.enabled (not (hasKey .Values.env "TOOLMESH_MCP_DATETIME_URL")) }}
            - name: TOOLMESH_MCP_DATETIME_URL
              value: {{ printf "http://%s:%v/mcp" (include "helm.mcpDatetime.fullname" .) .Values.mcpDatetime.service.port | quote }}
            {{- end }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
