{{- if and .Values.enabled (not .Values.oidc.clientSecret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "helm.oidcSecretName" . }}
  labels:
    {{- include "helm.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.oidc.clientSecret.key }}: {{ required "oidc.clientSecret.value or oidc.clientSecret.existingSecret is required" .Values.oidc.clientSecret.value | quote }}
{{- end }}
