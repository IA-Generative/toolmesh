# Deployment values shared by every environment, same layout as Muffin's `values/common-values.yaml`.
# `values.yaml` only holds the chart's defaults and documentation: what is specific to toolmesh (OIDC
# settings, the Secret holding the client secret, the wiring between the backend and the datetime MCP
# server) lives here. Layer an environment file on top:
#
#   helm upgrade --install toolmesh ./helm -f helm/values/common-values.yaml -f values-<env>.yaml
#
# What an environment file must set: the Ingress host (and `tls`),
# `global.vaultMount` (the Vault KV v2 mount) and `global.vaultEnv` (dev, staging, prod...: the first
# level of every path, `<vaultEnv>/toolmesh/<secret>`), the `vaultAuthRef` if it differs, and the image
# tag if it differs from the chart's appVersion.
#
# `{{ "{{" }} ... {{ "}}" }}` is how a Vault Secrets Operator template is written inside a Helm value:
# `extraObjects` is rendered with `tpl`, so the escaped braces come out as `{{ ... }}` for the operator.

# Fixed resource names (`toolmesh-backend`, `toolmesh-mcp-datetime`), independent of the release name:
# the backend reaches the MCP server by its Service name, and `env` values are not templated.
fullnameOverride: "toolmesh"

global:
  # Where the Vault Secrets Operator reads the secrets: KV v2 mount `vaultMount`, path
  # `<vaultEnv>/toolmesh/<secret>`. Defaults; an environment file overrides `vaultEnv`.
  vaultMount: "exploration"
  vaultEnv: "dev"
  # One Ingress for the whole application: `/api` goes to the backend, everything else to the frontend.
  # The host (and `tls`) belong to the environment file.
  ingress:
    enabled: true
    className: ""
    annotations: {}
    hosts:
      - name: "toolmesh.example.org"
        paths:
          - path: "/api"
            pathType: "Prefix"
            backend:
              serviceName: "toolmesh-backend"
              portNumber: 80
          - path: "/"
            pathType: "Prefix"
            backend:
              serviceName: "toolmesh-frontend"
              portNumber: 80

backend:
  # Keycloak settings (issuer, audience, client id and secret), from the Secret created by `extraObjects` below.
  envFrom:
    - secretRef:
        name: "toolmesh-keycloak"
    - secretRef:
        name: "toolmesh-redis"
    # Listed last: its computed TOOLMESH_DATABASE_URL wins over any same-named key of the secrets above.
    - secretRef:
        name: "toolmesh-db-infos"
  # Plain (non-secret) app config - see the backend settings for the full contract.
  env:
    # The schema is migrated by the `migration` job below, not by every replica at startup.
    TOOLMESH_AUTO_MIGRATE: "false"
    TOOLMESH_KEYCLOAK_REALM: "toolmesh"
    TOOLMESH_KEYCLOAK_CLIENT_ID: "toolmesh"
    # Uncomment when the browser reaches Keycloak through another address than TOOLMESH_KEYCLOAK_URL (in Vault).
    # TOOLMESH_KEYCLOAK_PUBLIC_URL: "https://keycloak.example.org"
    # Browser login (BFF): the SPA and the backend share one origin, so the session cookie is first-party.
    TOOLMESH_FRONTEND_URL: "https://toolmesh.example.org"
    TOOLMESH_BACKEND_PUBLIC_URL: "https://toolmesh.example.org"
    TOOLMESH_SESSION_COOKIE_SECURE: "true"
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: "RuntimeDefault"
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# Static SPA served by nginx. It calls `/api` on its own origin (the Ingress routes it to the backend).
frontend:
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: "RuntimeDefault"
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "250m"
      memory: "128Mi"

# Standalone MCP server for dates and periods, protected by a Keycloak token.
mcp_datetime:
  envFrom:
    - secretRef:
        name: "toolmesh-keycloak"
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: "RuntimeDefault"
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

# Standalone MCP server for web search (SearXNG) and page reading, protected by a Keycloak token (audience `mcp-search`).
mcp_search:
  envFrom:
    - secretRef:
        name: "toolmesh-keycloak"
  env:
    # Cluster-internal address of the bundled SearXNG (Service `toolmesh-searxng`, see `searxng` below).
    MCP_SEARCH_SEARXNG_URL: "http://toolmesh-searxng:8080"
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: "RuntimeDefault"
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

# Applies the Alembic migrations of the registry. It is a `post-*` hook: on a fresh install, and on the first upgrade
# that introduces the database, the CNPG cluster and the `toolmesh-db-infos` Secret do not exist before the release
# is applied, so a `pre-*` hook would wait for them until the Helm timeout. The cost: on later upgrades the new
# backend pods start a few seconds before the schema is migrated.
jobs:
  migration:
    hook:
      enabled: true
      types:
        - "post-install"
        - "post-upgrade"
      weight: 0
      deletePolicy: "before-hook-creation,hook-succeeded"
    image:
      registry: "ghcr.io"
      repository: "ia-generative/toolmesh/backend"
      pullPolicy: "IfNotPresent"
    serviceAccount:
      enabled: true
      create: true
    command: ["python", "-c"]
    args:
      - |-
        import asyncio
        from app.config import get_settings
        from app.db.migrate import run_migrations

        asyncio.run(run_migrations(get_settings().database_url))
    envFrom:
      - secretRef:
          name: "toolmesh-db-infos"
    initContainers:
      - name: wait-for-postgres
        image: "ghcr.io/ia-generative/toolmesh/backend:{{ .Chart.AppVersion }}"
        imagePullPolicy: "IfNotPresent"
        command:
          - "python"
          - "-c"
          - |-
            import os, socket, time
            from urllib.parse import urlsplit

            u = urlsplit(os.environ["TOOLMESH_DATABASE_URL"])
            print(f"Waiting for PostgreSQL at {u.hostname}:{u.port or 5432}", flush=True)
            while True:
                try:
                    socket.create_connection((u.hostname, u.port or 5432), 2).close()
                    break
                except OSError:
                    time.sleep(1)
            print("PostgreSQL reachable", flush=True)
        envFrom:
          - secretRef:
              name: "toolmesh-db-infos"
        securityContext:
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: "10m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile:
        type: "RuntimeDefault"
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      capabilities:
        drop: ["ALL"]
    # A failed migration is retried at most twice, and a stuck one is stopped after 15 minutes instead of
    # blocking the release until the Helm timeout.
    backoffLimit: 2
    activeDeadlineSeconds: 900
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        cpu: "250m"
        memory: "256Mi"

extraObjects:
  # Vault keys: TOOLMESH_KEYCLOAK_URL, TOOLMESH_KEYCLOAK_CLIENT_SECRET (the secret of the `toolmesh` confidential
  # client: browser login, password/refresh grants and token exchange),
  # MCP_DATETIME_OIDC_ISSUER, MCP_DATETIME_OIDC_AUDIENCE. One secret for every component. The realm and the
  # client id are plain config, set in the `backend.env` above.
  toolmesh-keycloak:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: toolmesh-keycloak
    spec:
      vaultAuthRef: vault-auth
      mount: '{{ required "global.vaultMount is required (exploration...)" .Values.global.vaultMount }}'
      type: kv-v2
      path: '{{ required "global.vaultEnv is required (dev, staging, prod...)" .Values.global.vaultEnv }}/toolmesh/keycloak'
      refreshAfter: 60s
      rolloutRestartTargets:
        - kind: Deployment
          name: '{{ include "helper.componentFullname" (dict "root" . "componentName" "backend") }}'
        - kind: Deployment
          name: '{{ include "helper.componentFullname" (dict "root" . "componentName" "mcp_datetime") }}'
      destination:
        name: toolmesh-keycloak
        create: true

  # Vault key: REDIS_PASSWORD. The operator also builds TOOLMESH_REDIS_URL (sessions of the backend) from it.
  toolmesh-redis:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: toolmesh-redis
    spec:
      vaultAuthRef: vault-auth
      mount: '{{ required "global.vaultMount is required (exploration...)" .Values.global.vaultMount }}'
      type: kv-v2
      path: '{{ required "global.vaultEnv is required (dev, staging, prod...)" .Values.global.vaultEnv }}/toolmesh/redis'
      refreshAfter: 60s
      rolloutRestartTargets:
        - kind: Deployment
          name: '{{ include "helper.componentFullname" (dict "root" . "componentName" "backend") }}'
      destination:
        name: toolmesh-redis
        create: true
        transformation:
          templates:
            TOOLMESH_REDIS_URL:
              text: 'redis://:{{ "{{" }} get .Secrets "REDIS_PASSWORD" {{ "}}" }}@toolmesh-redis:6379/0'

  # CloudNativePG requires `kubernetes.io/basic-auth` secrets (username + password): an Opaque secret, the operator's
  # default, makes the Cluster wait forever for a usable one.
  # Vault keys: username (`postgres`), password. Superuser of the cluster, kept for administration only.
  toolmesh-db-superuser:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: toolmesh-db-superuser
    spec:
      vaultAuthRef: vault-auth
      mount: '{{ required "global.vaultMount is required (exploration...)" .Values.global.vaultMount }}'
      type: kv-v2
      path: '{{ required "global.vaultEnv is required (dev, staging, prod...)" .Values.global.vaultEnv }}/toolmesh/db-superuser'
      refreshAfter: 60s
      destination:
        name: toolmesh-db-superuser
        create: true
        type: kubernetes.io/basic-auth

  # Vault keys: username (`toolmesh`), password. Owner of the `toolmesh` database, created by the cluster at bootstrap.
  toolmesh-db-appuser:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: toolmesh-db-appuser
    spec:
      vaultAuthRef: vault-auth
      mount: '{{ required "global.vaultMount is required (exploration...)" .Values.global.vaultMount }}'
      type: kv-v2
      path: '{{ required "global.vaultEnv is required (dev, staging, prod...)" .Values.global.vaultEnv }}/toolmesh/db-appuser'
      refreshAfter: 60s
      destination:
        name: toolmesh-db-appuser
        create: true
        type: kubernetes.io/basic-auth

  # Reads the same Vault path as `toolmesh-db-appuser` (one password to write, none to keep in sync) and keeps only
  # the computed TOOLMESH_DATABASE_URL for the backend and the migration job. The host is the read-write Service of
  # the cluster (`cnpg.fullnameOverride`-rw); port and database match `cnpg.cluster.initdb`. The password must not
  # contain URL-reserved characters (use `openssl rand -hex 32`): VSO templates cannot URL-encode.
  toolmesh-db-infos:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: toolmesh-db-infos
    spec:
      vaultAuthRef: vault-auth
      mount: '{{ required "global.vaultMount is required (exploration...)" .Values.global.vaultMount }}'
      type: kv-v2
      path: '{{ required "global.vaultEnv is required (dev, staging, prod...)" .Values.global.vaultEnv }}/toolmesh/db-appuser'
      refreshAfter: 60s
      rolloutRestartTargets:
        - kind: Deployment
          name: '{{ include "helper.componentFullname" (dict "root" . "componentName" "backend") }}'
      destination:
        name: toolmesh-db-infos
        create: true
        transformation:
          excludes:
            - ".*"
          templates:
            TOOLMESH_DATABASE_URL:
              text: 'postgresql+asyncpg://{{ "{{" }} get .Secrets "username" {{ "}}" }}:{{ "{{" }} get .Secrets "password" {{ "}}" }}@toolmesh-pg-cluster-rw:5432/toolmesh'

  # Vault key: SEARXNG_SECRET (SearXNG's `secret_key`: any long random value, `openssl rand -hex 32`).
  toolmesh-searxng:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: toolmesh-searxng
    spec:
      vaultAuthRef: vault-auth
      mount: '{{ required "global.vaultMount is required (exploration...)" .Values.global.vaultMount }}'
      type: kv-v2
      path: '{{ required "global.vaultEnv is required (dev, staging, prod...)" .Values.global.vaultEnv }}/toolmesh/searxng'
      refreshAfter: 60s
      destination:
        name: toolmesh-searxng
        create: true

# Redis (sessions of the backend) is the bundled chart, like Muffin; its Service is `<fullnameOverride>`
# (host of TOOLMESH_REDIS_URL, see `toolmesh-redis`).
redis:
  enabled: true
  fullnameOverride: "toolmesh-redis"
  architecture: "standalone"
  auth:
    existingSecret: "toolmesh-redis"
    existingSecretPasswordKey: "REDIS_PASSWORD"
  # The generated redis.conf has no `dir`, so redis writes in / and a read-only root filesystem makes the RDB
  # snapshots fail (MISCONF): point it at the persistent volume.
  config:
    content: |
      # Redis configuration
      bind * -::*
      dir /data
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

# PostgreSQL of the registry: the `cluster` chart of CloudNativePG (alias `cnpg`), like Muffin. Its read-write Service
# is `<fullnameOverride>-rw` (host of TOOLMESH_DATABASE_URL, see `toolmesh-db-infos`).
cnpg:
  enabled: true
  fullnameOverride: "toolmesh-pg-cluster"
  mode: "standalone"
  cluster:
    imageName: "ghcr.io/cloudnative-pg/postgresql:17.7"
    # The namespace quota rejects any pod without requests/limits. CNPG applies these to every pod of the cluster,
    # including the `initdb` job and its `bootstrap-controller` init container, so the cluster cannot bootstrap
    # without them.
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"
    enableSuperuserAccess: true
    superuserSecret: "toolmesh-db-superuser"
    initdb:
      database: "toolmesh"
      owner: "toolmesh"
      secret:
        name: "toolmesh-db-appuser"

# Web search engine behind `mcp_search`, reached at its Service `<fullnameOverride>` on port 8080 only from inside the
# cluster (no Ingress). `search.formats` must list `json`: it is what `mcp_search` reads.
searxng:
  enabled: true
  fullnameOverride: "toolmesh-searxng"
  serviceAccount:
    create: false
    automount: false
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 977
    runAsGroup: 977
    fsGroup: 977
    # The init container copies settings.yml from a root-owned ConfigMap into an emptyDir: without `Always`, the
    # files stay root-owned and SearXNG cannot write to them.
    fsGroupChangePolicy: Always
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  secret:
    create: false
    existingSecret: "toolmesh-searxng"
    secretKey: "SEARXNG_SECRET"
  extraConfig:
    # The chart writes the string "false" here when its Valkey is off, and SearXNG then fails at startup with
    # "Valkey URL must specify one of the following schemes". The boolean `false` is what disables Valkey.
    valkey:
      url: false
    ui:
      default_locale: fr
    outgoing:
      request_timeout: 10
    search:
      safe_search: 1
      formats:
        - html
        - json
