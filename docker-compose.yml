# Dev stack: Keycloak (realm auto-imported), PostgreSQL + backend and frontend with hot reload.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8080
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/toolmesh-realm.json:/opt/keycloak/data/import/toolmesh-realm.json:ro

  redis:
    image: redis:7-alpine

  # Registry of sources and tools.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: toolmesh
      POSTGRES_PASSWORD: toolmesh
      POSTGRES_DB: toolmesh
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toolmesh"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    environment:
      TOOLMESH_KEYCLOAK_URL: http://keycloak:8080
      TOOLMESH_KEYCLOAK_PUBLIC_URL: http://localhost:8080
      TOOLMESH_KEYCLOAK_REALM: toolmesh
      TOOLMESH_KEYCLOAK_CLIENT_ID: toolmesh
      TOOLMESH_KEYCLOAK_CLIENT_SECRET: toolmesh-secret
      TOOLMESH_REDIS_URL: redis://redis:6379/0
      TOOLMESH_DATABASE_URL: postgresql+asyncpg://toolmesh:toolmesh@postgres:5432/toolmesh
      # Sources to discover live on the compose network (private addresses).
      TOOLMESH_DISCOVERY_ALLOW_PRIVATE_HOSTS: "true"
      TOOLMESH_FRONTEND_URL: ${TOOLMESH_FRONTEND_URL:-http://localhost:3000}
      TOOLMESH_BACKEND_PUBLIC_URL: http://localhost:${TOOLMESH_BACKEND_PORT:-8010}
    ports:
      - "${TOOLMESH_BACKEND_PORT:-8010}:8000"
    volumes:
      - ./backend/app:/app/app
    depends_on:
      keycloak:
        condition: service_started
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  # Standalone MCP server (dates / periods), streamable HTTP on /mcp.
  mcp-datetime:
    build: ./mcp-datetime
    environment:
      MCP_DATETIME_OIDC_ISSUER: http://localhost:8080/realms/toolmesh
      MCP_DATETIME_OIDC_JWKS_URL: http://keycloak:8080/realms/toolmesh/protocol/openid-connect/certs
      MCP_DATETIME_OIDC_AUDIENCE: mcp-datetime
    depends_on:
      - keycloak
    ports:
      - "8030:8000"

  # React SPA (Vite dev server with hot reload). Calls the backend on http://localhost:8010 from the browser.
  frontend:
    image: oven/bun:1
    working_dir: /app
    command: ["sh", "-c", "bun install --frozen-lockfile && bun run dev --host 0.0.0.0"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"

  # Meta-search engine behind the search MCP server (JSON output enabled in searxng/settings.yml).
  searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_BASE_URL: http://localhost:8888/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "8888:8080"

  # Web search / page reading MCP server (streamable HTTP on /mcp), reachable with a token exchanged for `mcp-search`.
  mcp-search:
    build: ./mcp-search
    environment:
      MCP_SEARCH_SEARXNG_URL: http://searxng:8080
      MCP_SEARCH_OIDC_ISSUER: http://localhost:8080/realms/toolmesh
      MCP_SEARCH_OIDC_JWKS_URL: http://keycloak:8080/realms/toolmesh/protocol/openid-connect/certs
      MCP_SEARCH_OIDC_AUDIENCE: mcp-search
    depends_on:
      - keycloak
      - searxng
    ports:
      - "8040:8000"

volumes:
  frontend_node_modules:
  postgres_data:
